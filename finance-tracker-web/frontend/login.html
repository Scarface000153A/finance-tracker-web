<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Finance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                        'primary-hover': '#4338ca',
                        surface: '#ffffff',
                        bg: '#f5f6fa',
                        muted: '#64748b',
                        border: '#e2e8f0',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                },
            },
        };
    </script>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f5f6fa;
        }
        .auth-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #a855f7 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .input-field {
            transition: all 0.2s ease;
        }
        .input-field:focus {
            ring-color: #4f46e5;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        .btn-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .blob-1 {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(79,70,229,0.1) 0%, transparent 50%);
            animation: float 20s infinite linear;
        }
        .blob-2 {
            position: absolute;
            bottom: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(168,85,247,0.1) 0%, transparent 50%);
            animation: float 25s infinite linear reverse;
        }
        @keyframes float {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .shimmer {
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden">
    <!-- Background blobs -->
    <div class="blob-1"></div>
    <div class="blob-2"></div>

    <div id="app" class="w-full max-w-md px-4 relative z-10">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center gap-2 text-2xl font-bold text-gray-800 hover:opacity-80 transition">
                <span class="text-3xl">💰</span>
                <span>Finance Tracker</span>
            </a>
        </div>

        <!-- Login Card -->
        <div class="glass-card rounded-2xl shadow-xl overflow-hidden">
            <!-- Header -->
            <div class="auth-gradient p-6 text-white text-center relative overflow-hidden">
                <div class="shimmer absolute inset-0"></div>
                <h2 class="text-2xl font-bold mb-1 relative">Welcome Back</h2>
                <p class="text-indigo-100 text-sm relative">Log in to your account</p>
            </div>

            <!-- Form -->
            <form @submit.prevent="handleLogin" class="p-6 space-y-5">
                <!-- Error Message -->
                <div v-if="errorMessage" class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg text-sm flex items-center gap-2">
                    <span>⚠️</span>
                    {{ errorMessage }}
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        v-model="formData.email"
                        placeholder="you@example.com"
                        required
                        :disabled="loading"
                        autofocus
                        class="input-field w-full px-4 py-2.5 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent disabled:opacity-50 disabled:cursor-not-allowed transition"
                    >
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
                    <input
                        type="password"
                        id="password"
                        v-model="formData.password"
                        placeholder="Enter your password"
                        required
                        :disabled="loading"
                        class="input-field w-full px-4 py-2.5 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent disabled:opacity-50 disabled:cursor-not-allowed transition"
                    >
                </div>

                <!-- Remember & Forgot -->
                <div class="flex items-center justify-between">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" v-model="rememberMe" class="w-4 h-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
                        <span class="text-sm text-gray-600">Remember me</span>
                    </label>
                    <a href="#" class="text-sm text-indigo-600 hover:text-indigo-500 font-medium transition">Forgot password?</a>
                </div>

                <!-- Submit -->
                <button
                    type="submit"
                    :disabled="loading"
                    class="btn-primary w-full py-3 text-white font-semibold rounded-lg shadow-lg disabled:opacity-60 disabled:cursor-not-allowed disabled:transform-none flex items-center justify-center gap-2"
                >
                    <span v-if="!loading">Log In</span>
                    <span v-else class="flex items-center gap-2">
                        <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Logging in...
                    </span>
                </button>

                <!-- Sign up link -->
                <p class="text-center text-sm text-gray-600">
                    Don't have an account?
                    <a href="signup.html" class="text-indigo-600 font-medium hover:text-indigo-500 transition">Sign up</a>
                </p>
            </form>
        </div>

        <!-- Benefits -->
        <div class="mt-6 grid grid-cols-2 gap-3">
            <div class="bg-white/80 backdrop-blur rounded-xl p-4 text-center border border-white/50">
                <div class="text-2xl mb-1">📊</div>
                <div class="text-xs font-medium text-gray-700">Real-time Analytics</div>
            </div>
            <div class="bg-white/80 backdrop-blur rounded-xl p-4 text-center border border-white/50">
                <div class="text-2xl mb-1">🔒</div>
                <div class="text-xs font-medium text-gray-700">Secure Auth</div>
            </div>
            <div class="bg-white/80 backdrop-blur rounded-xl p-4 text-center border border-white/50">
                <div class="text-2xl mb-1">📱</div>
                <div class="text-xs font-medium text-gray-700">Responsive</div>
            </div>
            <div class="bg-white/80 backdrop-blur rounded-xl p-4 text-center border border-white/50">
                <div class="text-2xl mb-1">⚡</div>
                <div class="text-xs font-medium text-gray-700">Fast & Light</div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    formData: {
                        email: '',
                        password: ''
                    },
                    rememberMe: false,
                    loading: false,
                    errorMessage: ''
                };
            },
            mounted() {
                const token = localStorage.getItem('token');
                if (token) {
                    window.location.href = 'dashboard.html';
                }
            },
            methods: {
                async handleLogin() {
                    this.errorMessage = '';
                    this.loading = true;
                    try {
                        const formData = new URLSearchParams();
                        formData.append('username', this.formData.email);
                        formData.append('password', this.formData.password);
                        const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: formData.toString()
                        });
                        const data = await response.json();
                        if (response.ok) {
                            localStorage.setItem('token', data.access_token);
                            if (this.rememberMe) {
                                localStorage.setItem('remembered_email', this.formData.email);
                            } else {
                                localStorage.removeItem('remembered_email');
                            }
                            window.location.href = 'dashboard.html';
                        } else {
                            this.errorMessage = data.detail || 'Invalid email or password';
                        }
                    } catch (error) {
                        console.error('Login error:', error);
                        this.errorMessage = 'Unable to connect to the server. Please try again later.';
                    } finally {
                        this.loading = false;
                    }
                }
            },
            created() {
                const rememberedEmail = localStorage.getItem('remembered_email');
                if (rememberedEmail) {
                    this.formData.email = rememberedEmail;
                    this.rememberMe = true;
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
