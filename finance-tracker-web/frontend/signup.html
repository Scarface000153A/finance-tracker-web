<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Finance Tracker</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography,forms,container-queries" data-tailwindcss></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                        'primary-hover': '#4338ca',
                        surface: '#ffffff',
                        bg: '#f5f6fa',
                        muted: '#64748b',
                        border: '#e2e8f0',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                },
            },
        };
    </script>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f5f6fa;
        }
        .auth-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #a855f7 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .input-field {
            transition: all 0.2s ease;
        }
        .input-field:focus {
            ring-color: #4f46e5;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        .btn-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .blob-1 {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(79,70,229,0.1) 0%, transparent 50%);
            animation: float 20s infinite linear;
        }
        .blob-2 {
            position: absolute;
            bottom: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(168,85,247,0.1) 0%, transparent 50%);
            animation: float 25s infinite linear reverse;
        }
        @keyframes float {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .shimmer {
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            font-size: 1.1rem;
            padding: 2px;
        }
        .password-toggle:hover {
            color: #64748b;
        }
        .strength-bar {
            height: 4px;
            border-radius: 2px;
            margin-top: 6px;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden">
    <!-- Background blobs -->
    <div class="blob-1"></div>
    <div class="blob-2"></div>

    <div id="app" class="w-full max-w-md px-4 relative z-10">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center gap-2 text-2xl font-bold text-gray-800 hover:opacity-80 transition">
                <span class="text-3xl">💰</span>
                <span>Finance Tracker</span>
            </a>
        </div>

        <!-- Sign Up Card -->
        <div class="glass-card rounded-2xl shadow-xl overflow-hidden">
            <!-- Header -->
            <div class="auth-gradient p-6 text-white text-center relative overflow-hidden">
                <div class="shimmer absolute inset-0"></div>
                <h2 class="text-2xl font-bold mb-1 relative">Create Account</h2>
                <p class="text-indigo-100 text-sm relative">Join thousands managing their finances</p>
            </div>

            <!-- Form -->
            <form @submit.prevent="handleSignup" class="p-6 space-y-4">
                <!-- Error Message -->
                <div v-if="errorMessage" class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg text-sm flex items-center gap-2">
                    <span>⚠️</span>
                    {{ errorMessage }}
                </div>

                <!-- Success Message -->
                <div v-if="successMessage" class="bg-green-50 border border-green-200 text-green-600 px-4 py-3 rounded-lg text-sm flex items-center gap-2">
                    <span>✅</span>
                    {{ successMessage }}
                </div>

                <!-- Full Name -->
                <div>
                    <label for="fullname" class="block text-sm font-medium text-gray-700 mb-1.5">Full Name</label>
                    <input
                        type="text"
                        id="fullname"
                        v-model="formData.fullName"
                        placeholder="John Doe"
                        class="input-field w-full px-4 py-2.5 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                    >
                </div>

                <!-- Username -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">Username *</label>
                    <input
                        type="text"
                        id="username"
                        v-model="formData.username"
                        placeholder="johndoe"
                        required
                        minlength="3"
                        class="input-field w-full px-4 py-2.5 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                    >
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email Address *</label>
                    <input
                        type="email"
                        id="email"
                        v-model="formData.email"
                        placeholder="you@example.com"
                        required
                        class="input-field w-full px-4 py-2.5 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                    >
                </div>

                <!-- Password -->
                <div class="relative">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password *</label>
                    <input
                        :type="showPassword ? 'text' : 'password'"
                        id="password"
                        v-model="formData.password"
                        placeholder="Min. 6 characters"
                        required
                        minlength="6"
                        @input="checkPasswordStrength"
                        class="input-field w-full px-4 py-2.5 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition pr-10"
                    >
                    <button type="button" @click="showPassword = !showPassword" class="password-toggle">{{ showPassword ? '🙈' : '👁️' }}</button>
                    <div v-if="formData.password" class="strength-bar" :style="strengthBarStyle"></div>
                </div>

                <!-- Confirm Password -->
                <div class="relative">
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1.5">Confirm Password *</label>
                    <input
                        :type="showConfirmPassword ? 'text' : 'password'"
                        id="confirmPassword"
                        v-model="formData.confirmPassword"
                        placeholder="Re-enter your password"
                        required
                        class="input-field w-full px-4 py-2.5 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition pr-10"
                        :class="{ 'border-red-400 focus:ring-red-500': passwordMismatch }"
                    >
                    <button type="button" @click="showConfirmPassword = !showConfirmPassword" class="password-toggle">{{ showConfirmPassword ? '🙈' : '👁️' }}</button>
                    <div v-if="passwordMismatch && formData.confirmPassword" class="text-red-500 text-xs mt-1">Passwords do not match</div>
                </div>

                <!-- Submit -->
                <button
                    type="submit"
                    :disabled="loading"
                    class="btn-primary w-full py-3 text-white font-semibold rounded-lg shadow-lg disabled:opacity-60 disabled:cursor-not-allowed disabled:transform-none flex items-center justify-center gap-2 mt-2"
                >
                    <span v-if="!loading">Create Account</span>
                    <span v-else class="flex items-center gap-2">
                        <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Creating...
                    </span>
                </button>

                <!-- Sign in link -->
                <p class="text-center text-sm text-gray-600 mt-4">
                    Already have an account?
                    <a href="login.html" class="text-indigo-600 font-medium hover:text-indigo-500 transition">Log in</a>
                </p>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    formData: {
                        fullName: '',
                        username: '',
                        email: '',
                        password: '',
                        confirmPassword: ''
                    },
                    showPassword: false,
                    showConfirmPassword: false,
                    loading: false,
                    errorMessage: '',
                    successMessage: '',
                    passwordStrength: 0
                };
            },
            computed: {
                passwordMismatch() {
                    return this.formData.confirmPassword && this.formData.password !== this.formData.confirmPassword;
                },
                strengthBarStyle() {
                    const colors = ['#dc2626', '#f59e0b', '#84cc16', '#22c55e'];
                    const widths = ['25%', '50%', '75%', '100%'];
                    const idx = Math.min(this.passwordStrength, 3);
                    return {
                        width: widths[idx],
                        backgroundColor: colors[idx]
                    };
                }
            },
            methods: {
                checkPasswordStrength() {
                    const pwd = this.formData.password;
                    let score = 0;
                    if (pwd.length >= 6) score++;
                    if (pwd.length >= 10) score++;
                    if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
                    if (/[0-9]/.test(pwd)) score++;
                    if (/[^A-Za-z0-9]/.test(pwd)) score++;
                    this.passwordStrength = Math.min(score, 4);
                },
                async handleSignup() {
                    this.errorMessage = '';
                    this.successMessage = '';

                    if (this.formData.password !== this.formData.confirmPassword) {
                        this.errorMessage = 'Passwords do not match!';
                        return;
                    }

                    if (this.formData.password.length < 6) {
                        this.errorMessage = 'Password must be at least 6 characters long';
                        return;
                    }

                    this.loading = true;

                    try {
                        const response = await fetch(`${API_BASE_URL}/api/auth/register`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                email: this.formData.email,
                                username: this.formData.username,
                                password: this.formData.password,
                                full_name: this.formData.fullName || null
                            })
                        });

                        const data = await response.json();

                        if (response.ok) {
                            this.successMessage = 'Account created successfully! Redirecting to login...';
                            this.formData = { fullName: '', username: '', email: '', password: '', confirmPassword: '' };
                            setTimeout(() => {
                                window.location.href = 'login.html';
                            }, 2000);
                        } else {
                            this.errorMessage = data.detail || 'Registration failed. Please try again.';
                        }
                    } catch (error) {
                        console.error('Signup error:', error);
                        this.errorMessage = 'Unable to connect to the server. Please try again later.';
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
